# Intel RealSense D435i stream configuration for Jetson Orin Nano Super.
#
# Rationale for chosen resolutions:
#   - 10 cm tags in a 4x8 m arena -> need ~3-4 m detection range
#   - Color 1280x720 gives ~4 m tag range at quad_decimate=1.0
#   - Depth 848x480 is the D435 native stereo resolution; running depth at
#     1280x720 is a software upsample with no real accuracy gain
#   - rs.align(stream.color) upsamples depth to color res so each color pixel
#     has a valid depth reading (cheap on Orin Nano Super)

streams:
  color:
    width: 1280
    height: 720
    fps: 30
    format: bgr8
  depth:
    width: 848
    height: 480
    fps: 30
    format: z16

align_to: color            # align depth onto color frame
depth_preset: high_accuracy

# IMU: this project's camera is a D435 (no IMU). The chassis BNO08x on the
# ESP32 is the authoritative orientation source, read via telemetry.
# Leave this false — flipping it true on a D435 will error at pipeline start.
use_imu: false

# Depth stream post-processing (applied in order on the Jetson before ROI check)
depth_filters:
  decimation:   {enabled: false, magnitude: 2}
  threshold:    {enabled: true,  min_m: 0.15, max_m: 4.0}
  spatial:      {enabled: true,  magnitude: 2, alpha: 0.5, delta: 20}
  temporal:     {enabled: true,  alpha: 0.4, delta: 20}
  hole_filling: {enabled: false, mode: 1}
