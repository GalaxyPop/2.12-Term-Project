# 2.12 Term Project — Arena definition (3D / SE(3))
#
# All lengths in meters. All angles in radians (*_deg variants allowed).
# World frame (right-handed):
#   origin = bottom-left corner of Ramp A lower edge
# +X = up the ramp / toward Ramp B
# +Y = left when facing up the ramp
# +Z = up from the floor
# Robot pose is still 2D (x, y, theta) in the ground plane; tag poses are
# full SE(3) because tags are mounted at arbitrary height on walls, tables,
# and ramp faces.

arena:
  size:
    length_x: 8.0
    width_y: 4.0
    height_z: 2.0            # typical ceiling / max reasonable tag height
  origin_description: >
    World (0, 0, 0) on the ground at center base of Ramp A lower edge.
    Robot starts near (x < 0, y = 0) facing +X.

# AprilTag detector parameters (same as lab8 defaults).
apriltag:
  family: tag36h11
  default_size_m: 0.10
  quad_decimate: 1.0
  quad_sigma: 0.0
  refine_edges: 1
  decode_sharpening: 0.25
  min_decision_margin: 25.0
  # Only trust a tag update for localization when the robot's base roll/pitch
  # are small (i.e., robot is on flat ground, not mid-ramp). Ramp traversal
  # is open-loop from the ESP32 IMU; tags are re-acquired at the top/bottom.
  max_base_tilt_for_ekf_rad: 0.087   # ~5 deg

# Known tags in the world, full 6-DoF.
#   x, y, z      : tag center position in world frame (meters)
#   roll, pitch, yaw : rotation applied in XYZ order to get the tag's
#                      axes from world axes. A tag flat on the floor with
#                      its text readable from +X side has roll=pitch=yaw=0.
#                      A tag on a vertical wall facing +X direction has
#                      roll=0, pitch=0, yaw=0 and needs an extra -90° pitch
#                      to stand upright — see examples below.
#
# Convention used here: tag's +Z axis points *out of the tag face* (the
# direction the camera must look FROM to see it). So a wall-mounted tag
# facing the robot at its approach has its +Z pointing toward the robot.
#
# Convert a wall-mounted tag facing world-+X direction:
#   roll = -pi/2, pitch = 0, yaw = -pi/2
# (Rotates world +Z -> tag +Z_out, then aligns tag's top with world +Z.)
#
# Floor-flat tag: no rotation needed (roll=pitch=yaw=0) if the tag face
# is up and its top edge points in world +Y. Use ONLY for floor markers.
#
# Ramp-surface tag (tag glued flat to the slope surface of ramp A, which
# has pitch angle ~18°, face pointing up-and-back toward approach):
#   roll = 0, pitch = -0.314, yaw = 0     (tag normal tilted -18° in pitch)

tags:
  # --- Floor / ground-plane markers (optional; prefer vertical tags) ---
  # (floor tags work but you lose a lot of pose info when observed at low
  #  grazing angle; avoid unless vertical mounting is impossible)

  # --- Ramp approach markers (vertical, on posts at ramp entry) ---
  - id: 4
    x: 0.05
    y: -0.682   # assuming right of ramp = negative Y
    z: 0.31     # center of tag is 31 cm above ground
    roll: -1.5708
    pitch: 0.0
    yaw: -1.5708                # face world -X (toward the robot approaching)
    size: 0.093
    desc: "ramp_A_base_marker"
