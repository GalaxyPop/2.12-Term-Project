# Named waypoints on the ground plane. Keys MUST match the strings used in
# src/robot/robot_pseudo_functions.cpp executePathPlanTo(...) calls.
waypoints:
  base_of_slope_A:          {x: -0.30, y:  0.00, theta:  0.0000}
  top_of_slope_A:           {x:  0.80, y:  0.00, theta:  0.0000}
  base_of_slope_B:          {x:  1.80, y:  0.00, theta:  0.0000}
  preset_tray_tag_visible:  {x: -1.50, y:  1.00, theta:  1.5708}
  dinner_table_vicinity:    {x:  0.00, y:  1.80, theta:  1.5708}
  dishwasher_tray_vicinity: {x:  0.00, y: -1.50, theta: -1.5708}
  dishwasher_vicinity:      {x: -1.00, y: -1.80, theta:  3.14159}
  start_position:           {x:  0.865, y:  -1.665, theta:  1.5708}
# Ramp surfaces — the planner treats these as lethal (planar A* can't cross
# them); dedicated FSM states (TRAVERSE_RAMP_UP_*) bypass the planner and
# hand control to the ESP32 IMU-leveled drive loop.
#
# Each ramp is defined by its footprint (axis-aligned on the ground plane)
# plus a slope angle. This lets us later build a 3D collision model if we
# want to reason about tip-over envelopes.
ramps:
  ramp_A:
    footprint: {xmin:  0.00, ymin: 0.00, xmax:  .92, ymax:  -0.61}
    pitch_rad: 0.325              # ~18° climb along +X
    top_height_m: 0.31            # height at x=xmax
    direction: "+x"               # climb direction in world frame
  ramp_B:
    footprint: {xmin:  0.92, ymin: -0.61, xmax:  1.53, ymax:  -1.53}
    pitch_rad: 0.325            # descending along -y from ramp A peak
    top_height_m: 0.31            # at xmin (shared with ramp A top)
    direction: "+y"

# Static non-ramp obstacles for the planar costmap (axis-aligned rectangles).
